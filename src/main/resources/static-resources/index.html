<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>umami-akka</title>
<style>
  body { font-family: -apple-system, Helvetica, Arial, sans-serif; background: #f6f6f6; margin: 0; padding: 24px; color: #111; }
  h1 { font-size: 16px; margin: 0 0 16px; }
  .row { display: flex; gap: 12px; }
  .stat { background: #fff; border: 1px solid #e5e5e5; border-radius: 6px; padding: 16px; flex: 1; }
  .label { font-weight: 600; font-size: 13px; }
  .value { font-size: 28px; font-weight: 700; margin-top: 4px; }
  input, button { font-size: 13px; padding: 4px 8px; margin-right: 8px; }
</style>
</head>
<body>
<h1>umami-akka — website stats</h1>
<div>
  <input id="websiteId" placeholder="websiteId">
  <button onclick="load()">Load</button>
</div>
<div class="row" style="margin-top: 16px;">
  <div class="stat"><div class="label">Visitors</div><div class="value" id="visitors">-</div></div>
  <div class="stat"><div class="label">Visits</div><div class="value" id="visits">-</div></div>
  <div class="stat"><div class="label">Views</div><div class="value" id="pageviews">-</div></div>
  <div class="stat"><div class="label">Bounce rate</div><div class="value" id="bounceRate">-</div></div>
</div>
<script>
async function load() {
  const id = document.getElementById('websiteId').value;
  const now = Date.now();
  const start = now - 24 * 60 * 60 * 1000;
  const res = await fetch(`/api/websites/${id}/stats?startAt=${start}&endAt=${now}`);
  const data = await res.json();
  document.getElementById('visitors').textContent = data.visitors;
  document.getElementById('visits').textContent = data.visits;
  document.getElementById('pageviews').textContent = data.pageviews;
  const rate = data.visits > 0 ? Math.round((data.bounces / data.visits) * 100) : 0;
  document.getElementById('bounceRate').textContent = rate + '%';
}
</script>
</body>
</html>
